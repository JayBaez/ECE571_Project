# Example experiment configuration - Phase 2 shape.
#
# This is a harmless, illustrative example only - it does not
# correspond to any experiment that has actually been run. Per-problem
# config files (e.g. configs/problem2_davis_random_forest.yaml) will
# be added when each problem is implemented, following this same
# shape. See course_context/EXPERIMENT_PLAN.md for the planned
# experiments this will eventually configure.
#
# Required keys (checked by experiment_runner.validate_config()):
# problem, model, seed. Everything else is optional / problem-specific.

problem: problem2
task: regression
dataset: Davis
model: random_forest
seed: 42

features:
  use_clear_sky_index: true
  use_time_cyclical: true
  use_lags: false

split:
  type: chronological
  train_fraction: 0.8

notes: "Example config only - not yet used by any runnable script."
